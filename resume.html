<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma Pragnya — Résumé</title>
    <link rel="icon" href="pictures/star3.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #170a10;
            --bg-2: #250f18;
            --text: #f6ecd9;
            --muted: #c9b393;
            --gold: #e6b64a;
            --brd: rgba(232, 200, 120, 0.18);
            --grad: linear-gradient(100deg, #f6d27a, #f4a11a 45%, #c0392b);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Mukta', system-ui, sans-serif;
            background:
                radial-gradient(900px 500px at 85% -10%, rgba(244, 161, 26, 0.14), transparent 60%),
                radial-gradient(700px 500px at 0% 110%, rgba(184, 48, 42, 0.14), transparent 60%),
                linear-gradient(180deg, var(--bg), var(--bg-2));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 16px clamp(16px, 4vw, 34px);
            border-bottom: 1px solid var(--brd);
            background: rgba(23, 10, 16, 0.7);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .bar h1 {
            font-family: 'Marcellus', serif;
            font-size: clamp(1.05rem, 3vw, 1.4rem);
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .bar h1 span {
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .actions { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-family: 'Mukta', sans-serif;
            cursor: pointer;
            border: 1px solid var(--brd);
            color: var(--text);
            background: rgba(255, 240, 220, 0.05);
            transition: transform 0.25s ease, border-color 0.25s, background 0.25s;
        }
        .btn:hover { transform: translateY(-2px); border-color: var(--gold); }
        .btn.primary { background: var(--grad); color: #2a1206; font-weight: 600; border-color: transparent; }

        .viewer { flex: 1; padding: clamp(10px, 2.5vw, 22px); display: flex; }
        .viewer object, .viewer embed, .viewer iframe {
            display: block;
            width: 100%;
            flex: 1;
            min-height: calc(100vh - 130px);
            border: 1px solid var(--brd);
            border-radius: 14px;
            background: #2a2a2a;
            box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.7);
        }

        .fallback { text-align: center; color: var(--muted); padding: 40px 20px; }
        .fallback a { color: var(--gold); }
    </style>
</head>

<body>
    <div class="bar">
        <h1>Soma Pragnya · <span>Résumé</span></h1>
        <div class="actions">
            <a class="btn primary" href="Pragnya_Resume.pdf" download="Soma_Pragnya_Resume.pdf">
                <i class="fas fa-download"></i> Download
            </a>
            <a class="btn" href="index.html"><i class="fas fa-arrow-left"></i> Back to portfolio</a>
        </div>
    </div>

    <div class="viewer">
        <object data="Pragnya_Resume.pdf" type="application/pdf" width="100%" height="100%">
            <iframe src="Pragnya_Resume.pdf" title="Résumé PDF"></iframe>
            <p class="fallback">
                Your browser can't display the PDF inline.
                <a href="Pragnya_Resume.pdf" target="_blank" rel="noopener">Open it in a new tab</a> or use the
                Download button above.
            </p>
        </object>
    </div>
</body>

</html>
